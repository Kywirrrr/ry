<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Dekorasi background */
    body::before {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(59, 130, 246, 0.25);
      border-radius: 50%;
      filter: blur(100px);
      top: -100px;
      right: -100px;
    }

    body::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(139, 92, 246, 0.2);
      border-radius: 50%;
      filter: blur(100px);
      bottom: -100px;
      left: -100px;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      color: white;
      padding: 20px;
    }

    .container h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .container p {
      font-size: 17px;
      color: #d1d5db;
      margin-bottom: 35px;
    }

    /* Tombol utama */
    .main-button {
      display: inline-block;
      padding: 16px 45px;
      background: white;
      color: #111827;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      border-radius: 50px;
      transition: 0.3s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .main-button:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 15px 35px rgba(0,0,0,0.35);
    }

    /* Tombol kiri bawah */
    .bottom-button {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 10;

      padding: 9px 15px;
      background: rgba(255,255,255,0.12);
      color: white;
      text-decoration: none;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      transition: 0.3s ease;
    }

    .bottom-button:hover {
      background: white;
      color: #111827;
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      .container h1 {
        font-size: 32px;
      }

      .container p {
        font-size: 15px;
      }

      .main-button {
        padding: 14px 35px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Selamat Datang</h1>
    <p>Klik tombol di bawah untuk melanjutkan.</p>

    <a href="https://s.id/AsesmenSMAN1Babelan?s=qr" class="main-button">
      Masuk Sekarang
    </a>
  </div>

  <a href="https://drive.google.com/drive/folders/1VUTkupvvzwAXKT1MPAG3zDlxQlBh63TN" class="bottom-button">
    Ω
  </a>

</body>
</html>
